name: Security and compatibility
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    services:
      mariadb:
        image: mariadb:12.1
        env:
          MARIADB_ROOT_PASSWORD: isolated-ci-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: openssl, mbstring, pdo_sqlite, pdo_mysql, curl, gd, xmlwriter
          coverage: none
          tools: composer:v2
      - name: Install test dependencies
        run: |
          composer config repositories.asset-packagist composer https://asset-packagist.org
          composer update --no-interaction --prefer-dist
          composer audit --no-interaction
      - name: Security, authentication and SQLite migrations
        run: |
          vendor/bin/phpunit --configuration phpunit.xml.dist
          php tests/MinimalConsoleCheck.php
      - name: MariaDB installation, upgrade and repeat
        env:
          UM_TEST_DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=mysql
          UM_TEST_DB_USER: root
          UM_TEST_DB_PASSWORD: isolated-ci-password
        run: php tests/MariaDbMigrationCheck.php
